version: 2  # Required

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Without the custom install command,
    # RTD tries to install the whole project and requires hdf5.
    install:
    - uv sync --only-group docs

sphinx:
   configuration: docs/conf.py
   fail_on_warning: true

python:
   install:
   - method: uv
     command: sync

formats: all
